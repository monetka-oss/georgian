<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Грузинский</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Грузинский">
<style>
:root{color-scheme:dark light;--bg:#0A0C11;--panel:rgba(26,31,40,.62);--hover:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);
  --ink:#EEF0F5;--muted:#B8BECB;--accent:#FF5277;--glow:rgba(255,82,119,.35);--ok:#22c55e;--bad:#ef4444;--shadow:rgba(0,0,0,.45);
  --ka:"Noto Sans Georgian",Sylfaen,system-ui,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#EEF1F8;--panel:rgba(255,255,255,.72);--hover:rgba(0,0,0,.05);--border:rgba(0,0,0,.10);
  --ink:#11151F;--muted:#4B5563;--accent:#D81E48;--glow:rgba(216,30,72,.25);--ok:#15803d;--bad:#dc2626;--shadow:rgba(60,70,110,.16)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bg-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(72px);opacity:.4;animation:float 22s infinite alternate ease-in-out}
.orb-1{width:380px;height:380px;background:radial-gradient(circle,#FF3B69,transparent 70%);top:-12%;left:-10%}
.orb-2{width:320px;height:320px;background:radial-gradient(circle,#3B82F6,transparent 70%);top:35%;right:-14%;animation-duration:26s}
.orb-3{width:260px;height:260px;background:radial-gradient(circle,#10B981,transparent 70%);bottom:-10%;left:28%;animation-duration:19s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.1)}100%{transform:translate(-20px,20px) scale(.93)}}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;transition:transform .18s cubic-bezier(.16,1,.3,1),border-color .15s,background .15s,filter .15s}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* стекло */
.toolbar,.tile,.tabs,.panel,.opt,.btn.sec,.chip,.built,input,#back{background:var(--panel);border:1px solid var(--border);
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1px 1px rgba(255,255,255,.16),0 10px 30px var(--shadow)}
/* одна колонка: шапка, подзаголовок и контент строго одной ширины */
.toolbar,.subtitle,.root{width:min(700px,calc(100% - 28px));margin-left:auto;margin-right:auto}
header{position:sticky;top:0;z-index:20;padding:max(10px,env(safe-area-inset-top)) 0 8px}
.toolbar{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-radius:26px}
body.home header{position:static}
body.home .toolbar{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:4px}
#back{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
h1{font-size:1.15rem;line-height:1.2;font-weight:700}
body.home h1{font-size:2.3rem;line-height:1.08;color:var(--accent);font-weight:800;letter-spacing:-.03em}
.subtitle{color:var(--muted);font-size:.95rem;margin-top:4px;padding-left:4px}
.subtitle:empty{display:none}
body:not(.home) .subtitle{padding-left:18px}
.root{padding:14px 0 70px}
.scr{animation:in .3s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
/* поиск */
.sb{position:relative;margin-bottom:6px}
.sb svg{position:absolute;left:18px;top:50%;margin-top:-10px;color:var(--muted);pointer-events:none}
input{width:100%;min-height:52px;padding:12px 20px;border-radius:999px;font-size:1rem;outline:none}
.sb input{padding-left:48px}
input:focus{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
#a{font:1.3rem var(--ka);margin-bottom:4px}
/* главы: надпись → заголовок → список */
.ch{margin:30px 4px 0}
.ch small{display:block;color:var(--accent);font-weight:700;font-size:.95rem;margin-bottom:5px}
.ch h2{font-size:1.15rem;font-weight:700;line-height:1.3;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px;border-radius:22px;text-align:left}
.tile b,.tile small{display:block}
.tile b{font-size:1rem;font-weight:600}
.tile small{color:var(--muted);font-size:.9rem}
.emoji{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;
  background:hsl(var(--h) 85% 60%/.18);border:1px solid hsl(var(--h) 85% 60%/.38)}
.tile.done{border-color:var(--ok);background:rgba(34,197,94,.12)}
.tile.done::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800;font-size:1.2rem}
/* вкладки */
.tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;border-radius:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.92rem;border-radius:16px;white-space:nowrap}
.tab.active{background:var(--hover);color:var(--ink);box-shadow:inset 0 1px 1px rgba(255,255,255,.25)}
/* словарь */
.panel{border-radius:24px;padding:0 18px}
.item{padding:15px 0;border-bottom:1px solid var(--border)}
.item:last-child{border:0}
.item b{font-family:var(--ka);font-size:clamp(1.25rem,3.5vw,1.5rem);display:block}
.item span{display:block;margin-top:2px;font-size:.98rem}
.item small{display:block;color:var(--muted);font-size:.9rem;margin-top:3px}
/* карточка: высота по содержимому, обе стороны в одной ячейке сетки */
.card{width:100%;perspective:1200px;cursor:pointer}
.in{display:grid;transition:transform .5s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:54px 24px;background:linear-gradient(150deg,rgba(255,255,255,.1),var(--panel) 75%);border:1px solid var(--border);border-radius:28px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 16px 48px var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.tag{position:absolute;top:14px;left:14px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.82rem;font-weight:600;color:var(--muted);background:var(--hover);padding:4px 12px;border-radius:999px;border:1px solid var(--border)}
.hint{position:absolute;left:0;right:0;bottom:16px;font-size:.88rem;color:var(--muted)}
.face .ru{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:700;line-height:1.25}
.face .ka{font-family:var(--ka);font-size:clamp(2.1rem,7vw,3rem);color:var(--accent);font-weight:700;line-height:1.2}
.face .ctx{font-size:.95rem;color:var(--muted);line-height:1.4}
.swipe{text-align:center;color:var(--muted);font-size:.88rem;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
/* тесты */
.top-info{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;font-weight:500;padding:0 4px;margin-bottom:8px}
.bar{height:6px;background:var(--hover);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FF809B);border-radius:999px;transition:width .35s}
.ask{font-size:1.6rem;line-height:1.25;font-weight:700;margin:12px 4px 18px;letter-spacing:-.02em}
.options-wrap{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;width:100%;min-height:62px;padding:14px 20px;font:600 1.2rem var(--ka);border-radius:18px;text-align:left}
.opt:disabled{opacity:1;color:var(--ink)}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.18)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.18);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{padding:14px 20px;border-radius:18px;margin:14px 0 0;font-weight:600}
.msg.ok{background:rgba(34,197,94,.14);color:var(--ok);border:1px solid var(--ok)}
.msg.bad{background:rgba(239,68,68,.14);color:var(--bad);border:1px solid var(--bad)}
.msg .ka{display:inline;font-family:var(--ka);font-size:1.2rem;color:var(--ink);margin-left:4px}
/* конструктор */
.built{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;min-height:68px;padding:10px;margin-bottom:14px;border-radius:20px;border-style:dashed}
.ph{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chip{padding:10px 16px;border-radius:14px;font:1.15rem var(--ka)}
.built .chip{border-color:var(--accent);background:rgba(255,82,119,.16)}
/* кнопки */
.btns{display:grid;gap:10px;margin-top:14px}
.btn{width:100%;min-height:54px;padding:12px 20px;text-align:center;font-weight:600;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));border:1px solid color-mix(in srgb,var(--accent) 60%,#fff);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 28px var(--glow)}
.btn.sec{color:var(--ink)}
.btn.ok{background:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,#fff);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 24px rgba(34,197,94,.3)}
.btn.bad{background:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,#fff);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 24px rgba(239,68,68,.3)}
.btn:disabled{opacity:.4}
.score{font-size:4rem;font-weight:800;color:var(--accent);line-height:1;margin:26px 0 4px 4px;font-variant-numeric:tabular-nums}
.pct{color:var(--muted);margin:14px 4px;font-size:1rem}
/* нажатия и наведение */
:is(.tile,.tab,.opt,.btn,.chip,#back):active:not(:disabled){transform:scale(.97)}
@media(hover:hover){
  .tile:hover,.opt:hover:not(:disabled),.chip:hover,.btn.sec:hover:not(:disabled){border-color:var(--accent);background:var(--hover)}
  .tile:hover{transform:translateY(-1px)}
  .tab:hover{color:var(--ink);background:var(--hover)}
  .btn:hover:not(:disabled):not(.sec){filter:brightness(1.1)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<header>
  <div class="toolbar"><button id="back" hidden aria-label="Назад">←</button><h1 id="title">ქართული</h1></div>
  <div class="subtitle" id="subtitle"></div>
</header>
<main class="root" id="root"></main>
<script src="lib.js"></script>
<script>
const FILES = ['data/part1.md', 'data/part2.md', 'data/part3.md'];
const $ = s => document.querySelector(s), root = $('#root'), title = $('#title'), backBtn = $('#back'), subtitle = $('#subtitle');
const esc = s => s.replace(/[&<>"]/g, c => '&#' + c.charCodeAt() + ';');
const pl = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'выражение' : n % 10 > 1 && n % 10 < 5 && (n % 100 < 12 || n % 100 > 14) ? 'выражения' : 'выражений');
const EMOJI = [[/суфр|застол/i, '🍷'], [/зал|качалк/i, '💪'], [/сленг/i, '🔥'], [/идиом/i, '🎭'], [/конфликт/i, '🕊️'], [/^база/i, '💬'],
  [/реакц|удивлен/i, '😲'], [/спор/i, '⚔️'], [/знакомств/i, '👋'], [/быт|поиск/i, '🏠'], [/граммат|связк|союз/i, '🔗'], [/буфер/i, '⏱️'],
  [/кирпичик/i, '🧱'], [/пространств/i, '📍'], [/глагол|приста/i, '🧠'], [/уважен|респект/i, '🤜'], [/рынок|покупк/i, '🛒']];
const emojiFor = n => (EMOJI.find(([r]) => r.test(n)) || [0, '📚'])[1];
const HUE = [350, 215, 150, 40, 280];
const SEARCH = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const row = q => `<div class="item"><b>${esc(q.ka)}</b><span>${esc(q.ru)}</span>${q.ctx ? `<small>${esc(q.ctx)}</small>` : ''}</div>`;
const progress = (i, n) => `<div class="top-info"><span>${i + 1} из ${n}</span></div><div class="bar"><i style="width:${i / n * 100}%"></i></div>`;
const nextBtn = (last, extra = '') => `<div class="btns">${extra}<button class="btn" id="nx">${last ? 'Результат' : 'Дальше'}</button></div>`;
const result = (box, score, n, again) => {
  box.innerHTML = `<p class="score">${score}/${n}</p><p class="pct">${Math.round(score / n * 100)}% верно</p><div class="btns"><button class="btn" id="again">Ещё раз</button></div>`;
  $('#again').onclick = again;
};
let chapters = [], onBack = null;
backBtn.onclick = () => onBack && onBack();

function view(t, html, up, sub = '') {
  title.textContent = t; title.lang = up ? 'ru' : 'ka'; subtitle.textContent = sub;
  root.innerHTML = `<div class="scr">${html}</div>`; root.onclick = null;
  onBack = up; backBtn.hidden = !up; document.body.classList.toggle('home', !up); scrollTo(0, 0);
}

function home() {
  const all = chapters.flatMap(c => c.levels.flatMap(l => l.items)), due = srsDue(chapters).length;
  view('ქართული', `<div class="sb">${SEARCH}<input id="q" type="search" placeholder="Поиск по грузинскому и русскому" aria-label="Поиск"></div><div id="res"></div><div id="list">` +
    `<div class="ch"><small>Повторение</small><h2>Сложные фразы</h2></div><div class="grid" style="--h:45"><button class="tile" data-srs="1"><span class="emoji">🔄</span>` +
    `<div><b>Повторение сложного</b><small>${due ? pl(due) + ' к повторению' : 'Пока пусто: жми «Повторить» в карточках'}</small></div></button></div>` +
    chapters.map((c, ci) => `<div class="ch"><small>Глава ${ci + 1}</small><h2>${esc(c.title)}</h2></div><div class="grid" style="--h:${HUE[ci % HUE.length]}">` +
      c.levels.map((l, li) => {
        const known = l.items.filter(it => srsGet(it)?.status === 'review').length;
        return `<button class="tile${levelDone(l.items) ? ' done' : ''}" data-c="${ci}" data-l="${li}"><span class="emoji">${emojiFor(l.name)}</span>` +
          `<div><b>${esc(l.name)}</b><small>${pl(l.items.length)}${known ? ` · знаю ${known}` : ''}</small></div></button>`;
      }).join('') + '</div>').join('') + '</div>', null, 'Разговорный · ' + pl(all.length));
  $('#q').oninput = e => {
    const t = e.target.value.trim().toLowerCase(), r = t ? all.filter(q => (q.ka + ' ' + q.ru).toLowerCase().includes(t)) : [];
    $('#list').hidden = !!t;
    $('#res').innerHTML = !t ? '' : r.length ? `<div class="panel">${r.map(row).join('')}</div>` : '<p class="pct">Ничего не найдено</p>';
  };
  root.onclick = e => {
    const b = e.target.closest('[data-c]');
    if (b) level(+b.dataset.c, +b.dataset.l); else if (e.target.closest('[data-srs]')) srsMode();
  };
}

const TABS = [['cards', '🃏 Карточки'], ['choice', '🎯 Выбор ответа'], ['type', '⌨️ Ввод перевода'], ['build', '🧩 Собери фразу'], ['list', '📋 Словарь']];
function level(ci, li, k = 'cards') {
  const lv = chapters[ci].levels[li];
  view(lv.name, `<div class="tabs">${TABS.map(([id, t]) => `<button class="tab${id === k ? ' active' : ''}" data-k="${id}">${t}</button>`).join('')}</div><div id="mode"></div>`, home, pl(lv.items.length));
  ({ cards: cardsMode, choice: choiceMode, type: typeMode, build: buildMode, list: listMode })[k]($('#mode'), ci, li);
  root.onclick = e => { const t = e.target.closest('.tab'); if (t && t.dataset.k !== k) level(ci, li, t.dataset.k); };
}

const listMode = (box, ci, li) => { box.innerHTML = `<div class="panel">${chapters[ci].levels[li].items.map(row).join('')}</div>`; };

/* ---- карточки: перевернуть, назад/вперёд, свайп, «Знаю» / «Повторить» ---- */
function cardsMode(box, ci, li, all) {
  const lv = chapters[ci].levels[li], entries = lv.items.filter(it => all || srsIsDue(srsGet(it))).map(item => ({ item, tag: lv.name }));
  if (!entries.length) {
    box.innerHTML = '<p class="pct">Все карточки этого уровня выучены 🎉</p><div class="btns"><button class="btn" id="all">Пройти всё равно</button></div>';
    $('#all').onclick = () => cardsMode(box, ci, li, true); return;
  }
  flashcards(box, entries, () => cardsMode(box, ci, li, all));
}

function flashcards(box, entries, again) {
  let i = 0;
  const draw = () => {
    if (i >= entries.length) {
      box.innerHTML = '<p class="score">✓</p><p class="pct">Колода пройдена</p><div class="btns"><button class="btn" id="again">Ещё раз</button></div>';
      $('#again').onclick = again; return;
    }
    const { item: q, tag } = entries[i], last = i === entries.length - 1;
    box.innerHTML = progress(i, entries.length) +
      `<div class="card" id="cd" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="in">` +
      `<div class="face"><span class="tag">${esc(tag)}</span><span class="ru">${esc(q.ru)}</span><span class="hint">Нажми, чтобы перевернуть</span></div>` +
      `<div class="face b"><span class="tag">${esc(tag)}</span><span class="ka">${esc(q.ka)}</span><span class="ctx">${esc(q.ctx)}</span><span class="hint">↻ Нажми, чтобы вернуть</span></div></div></div>` +
      `<p class="swipe">‹ свайп влево / вправо — листать ›</p>` +
      `<div class="row2"><button class="btn sec" id="prev" ${i ? '' : 'disabled'}>← Назад</button><button class="btn sec" id="next" ${last ? 'disabled' : ''}>Вперёд →</button></div>` +
      `<div class="row2"><button class="btn bad" id="hard">Повторить ↻</button><button class="btn ok" id="know">Знаю ✓</button></div>`;
    const cd = $('#cd'), go = d => { if (i + d >= 0 && i + d < entries.length) { i += d; draw(); } };
    const grade = n => { srsSet(q, srsUpdate(srsGet(q) || srsDefault(), n)); i++; draw(); };
    let sx = 0, sy = 0;
    cd.onclick = () => cd.classList.toggle('f');
    cd.onkeydown = e => (e.key === ' ' || e.key === 'Enter') && (e.preventDefault(), cd.click());
    cd.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
    cd.ontouchend = e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    };
    $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
    $('#hard').onclick = () => grade(1); $('#know').onclick = () => grade(3);
  };
  draw();
}

function srsMode() {
  view('Повторение сложного', '<div id="mode"></div>', home);
  const box = $('#mode'), entries = srsDue(chapters).map(x => ({ item: x.item, tag: chapters[x.ci].levels[x.li].name }));
  if (!entries.length) { box.innerHTML = '<p class="pct">Пока нечего повторять. Нажимай «Повторить» на карточках, и сложные фразы появятся здесь.</p>'; return; }
  flashcards(box, entries, srsMode);
}

/* ---- выбор из 4 вариантов ---- */
function choiceMode(box, ci, li) {
  const lv = chapters[ci].levels[li], pool = chapters[ci].levels.flatMap(x => x.items), qs = shuffle(lv.items);
  let i = 0, score = 0;
  const ask = () => {
    const q = qs[i];
    box.innerHTML = progress(i, qs.length) + `<p class="ask">${esc(q.ru)}</p><div class="options-wrap">${options(q, pool, lv.items).map(x => `<button class="opt">${esc(x.ka)}</button>`).join('')}</div><div id="fb"></div>`;
    box.onclick = e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const good = b.textContent === q.ka; score += good;
      box.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.textContent === q.ka) o.classList.add('ok'); });
      if (!good) b.classList.add('bad');
      $('#fb').innerHTML = nextBtn(i + 1 === qs.length);
      $('#nx').onclick = () => (++i < qs.length ? ask() : result(box, score, qs.length, () => choiceMode(box, ci, li)));
    };
  };
  ask();
}

/* ---- ввод перевода ---- */
function typeMode(box, ci, li) {
  const qs = shuffle(chapters[ci].levels[li].items.filter(typable)); let i = 0, score = 0;
  if (!qs.length) { box.innerHTML = '<p class="pct">В этом уровне нет фраз для ввода</p>'; return; }
  const ask = () => {
    const q = qs[i];
    box.innerHTML = progress(i, qs.length) + `<p class="ask">${esc(q.ru)}</p><input id="a" lang="ka" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="По-грузински">` +
      `<div class="btns"><button class="btn" id="ok">Проверить</button></div><div id="fb"></div>`;
    const a = $('#a'), go = () => {
      if (a.disabled) return;
      a.disabled = true; $('#ok').parentElement.remove();
      const good = check(q.ka, a.value); score += good;
      $('#fb').innerHTML = `<p class="msg ${good ? 'ok' : 'bad'}" id="msg">${good ? '✓ Верно' : 'Правильно: <span class="ka">' + esc(q.ka) + '</span>'}</p>` +
        nextBtn(i + 1 === qs.length, good ? '' : '<button class="btn sec" id="ov">Засчитать</button>');
      $('#nx').onclick = () => (++i < qs.length ? ask() : result(box, score, qs.length, () => typeMode(box, ci, li)));
      const ov = $('#ov'); if (ov) ov.onclick = () => { score++; $('#msg').className = 'msg ok'; $('#msg').textContent = '✓ Верно'; ov.remove(); };
    };
    $('#ok').onclick = go; a.onkeydown = e => e.key === 'Enter' && go(); a.focus();
  };
  ask();
}

/* ---- «Собери фразу»: слова нажимаются по порядку, нажатие на собранное слово возвращает его вниз ---- */
function buildMode(box, ci, li) {
  const qs = shuffle(chapters[ci].levels[li].items.filter(buildable)); let i = 0, score = 0;
  if (!qs.length) { box.innerHTML = '<p class="pct">В этом уровне нет фраз для сборки</p>'; return; }
  const ask = () => {
    const q = qs[i], words = splitWords(phrase(q)); let bag = shuffle(words.map((_, k) => k)), built = [], locked = false;
    box.innerHTML = progress(i, qs.length) + `<p class="ask">${esc(q.ru)}</p><div class="built" id="built"></div><div class="chips" id="bag"></div>` +
      `<div id="fb"><div class="btns"><button class="btn" id="chk" disabled>Проверить</button></div></div>`;
    const draw = () => {
      const chip = k => `<button class="chip" data-k="${k}">${esc(words[k])}</button>`;
      $('#built').innerHTML = built.map(chip).join('') || '<span class="ph">Нажимай слова по порядку</span>';
      $('#bag').innerHTML = bag.map(chip).join('');
      $('#chk').disabled = bag.length > 0;
    };
    box.onclick = e => {
      const c = e.target.closest('.chip'); if (!c || locked) return;
      const k = +c.dataset.k;
      if (c.parentElement.id === 'built') { built = built.filter(x => x !== k); bag.push(k); } else { bag = bag.filter(x => x !== k); built.push(k); }
      draw();
    };
    $('#chk').onclick = () => {
      locked = true;
      const good = check(phrase(q), built.map(k => words[k]).join(' ')); score += good;
      $('#fb').innerHTML = `<p class="msg ${good ? 'ok' : 'bad'}">${good ? '✓ Верно' : 'Правильно: <span class="ka">' + esc(q.ka) + '</span>'}</p>` + nextBtn(i + 1 === qs.length);
      $('#nx').onclick = () => (++i < qs.length ? ask() : result(box, score, qs.length, () => buildMode(box, ci, li)));
    };
    draw();
  };
  ask();
}

Promise.all(FILES.map(f => fetch(f).then(r => r.ok ? r.text() : Promise.reject(f)).then(parse)))
  .then(x => { chapters = x; home(); })
  .catch(f => view('Ошибка', `<p class="pct">Не удалось загрузить ${esc(String(f))}. Откройте приложение по адресу сайта, а не как файл с диска.</p>`));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
