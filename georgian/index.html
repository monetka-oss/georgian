<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Грузинский</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Грузинский">
<style>
:root{color-scheme:light dark;--bg:#EEF0F6;--sf:#fff;--ink:#14161C;--mu:#5E6678;--ln:rgba(20,22,28,.1);--ac:#C2244A;--ai:#fff;
--g:rgba(255,255,255,.5);--gb:rgba(255,255,255,.7);--hl:rgba(255,255,255,.95);--sh:rgba(40,50,90,.13);
--ok:#12703C;--oks:rgba(40,180,100,.2);--bad:#B3261E;--bads:rgba(230,60,50,.16);
--mesh:radial-gradient(55vmax 55vmax at 8% -5%,rgba(194,36,74,.3),transparent 60%),radial-gradient(50vmax 50vmax at 100% 25%,rgba(99,102,241,.28),transparent 60%),radial-gradient(60vmax 60vmax at 45% 110%,rgba(20,184,166,.26),transparent 60%);
--ka:"Noto Sans Georgian",Sylfaen,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0A0C11;--sf:#1A1D26;--ink:#EEF0F5;--mu:#9AA3B5;--ln:rgba(255,255,255,.1);--ac:#FF6B88;--ai:#2A0A12;--g:rgba(38,42,56,.5);--gb:rgba(255,255,255,.14);--hl:rgba(255,255,255,.2);--sh:rgba(0,0,0,.45);--ok:#6FD39A;--oks:rgba(60,200,120,.2);--bad:#FF8A80;--bads:rgba(255,90,80,.2);
--mesh:radial-gradient(55vmax 55vmax at 8% -5%,rgba(255,107,136,.3),transparent 60%),radial-gradient(50vmax 50vmax at 100% 25%,rgba(110,120,255,.3),transparent 60%),radial-gradient(60vmax 60vmax at 45% 110%,rgba(30,200,180,.22),transparent 60%)}}
@media(prefers-reduced-transparency:reduce){:root{--g:var(--sf)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--g:var(--sf)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;transition:transform .3s cubic-bezier(.2,1.5,.4,1),border-color .15s}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row,.tile,.opt,.btn.sec,.panel,input,#back,.hd{background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--hl),0 8px 28px var(--sh)}
header{position:sticky;top:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 12px 0}
.hd,main{max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:32px}
main{padding:16px 16px 56px}
h1{font-size:1.15rem;line-height:1.25;margin:0;font-weight:700}
body.home header{position:static}
body.home .hd{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:4px}
body.home h1{font-size:2.4rem;line-height:1.1;color:var(--ac)}
#sub{margin:0;color:var(--mu);font-size:.85rem}#sub:empty{display:none}
#back{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.scr{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.sb{position:relative;margin-bottom:8px}
.sb svg{position:absolute;left:16px;top:50%;margin-top:-11px;color:var(--mu)}
input{width:100%;min-height:54px;padding:12px 20px;border-radius:999px}
input:focus{border-color:var(--ac);outline:0}
input[type=search]{padding-left:48px}
#a{font:1.3rem var(--ka);margin-bottom:12px}
.ch{margin:32px 0 12px 4px}
.ch small{display:block;color:var(--ac);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:.72rem}
.ch h2{font-size:1.05rem;font-weight:600;margin:2px 0 0;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.row,.tile,.opt{text-align:left}
.row{display:flex;align-items:center;gap:10px;min-height:62px;padding:12px 20px;border-radius:26px}
.row .n{margin-left:auto;color:var(--mu);font-size:.85rem}
.row svg{flex:none;color:var(--mu)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:18px 18px;min-height:136px;border-radius:30px}
.tile svg{color:var(--ac);margin-bottom:auto}
.tile small{color:var(--mu);line-height:1.3}
@media(hover:hover){.row:hover,.tile:hover,.opt:hover:not(:disabled){border-color:var(--ac)}}
:is(.row,.tile,.opt,.btn):active{transform:scale(.96)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{width:100%;min-height:56px;padding:12px 20px;text-align:center;font-weight:600;border-radius:999px;color:var(--ai);
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 78%,#fff),var(--ac));border:1px solid color-mix(in srgb,var(--ac) 65%,#fff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn.sec{color:var(--ink)}
.ka{font-family:var(--ka);font-size:clamp(1.4rem,4.5vw,1.8rem);line-height:1.3;display:block}
.panel{border-radius:30px;padding:0 22px}
.item{padding:16px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item span,.item small{display:block}
.item small,.ctx{color:var(--mu);font-size:.9rem}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;padding:0 4px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0 4px;box-shadow:inset 0 1px 2px var(--sh)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 75%,#fff),var(--ac));border-radius:4px}
.ask{font-size:1.65rem;line-height:1.3;font-weight:600;margin:24px 4px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:60px;margin-bottom:10px;padding:12px 20px;font:1.25rem var(--ka);border-radius:24px}
.opt.ok{border-color:var(--ok);background:var(--oks);color:var(--ok)}.opt.ok::after{content:"✓"}
.opt.bad{border-color:var(--bad);background:var(--bads);color:var(--bad)}.opt.bad::after{content:"✕"}
.msg{padding:14px 20px;border-radius:24px;margin:12px 0;font-weight:600}
.msg.ok{background:var(--oks);color:var(--ok)}.msg.ok::before{content:"✓ "}
.msg.bad{background:var(--bads);color:var(--bad)}.msg .ka{display:inline;font-size:1.25rem;color:var(--ink)}
.card{height:min(52vh,360px);margin:20px 0 16px;perspective:1200px;cursor:pointer}
.in{position:relative;height:100%;transition:transform .55s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:30px;overflow:auto;
  background:linear-gradient(150deg,var(--hl),var(--g) 70%);border:1px solid var(--gb);border-radius:36px;
  box-shadow:inset 0 1px 0 var(--hl),0 18px 50px var(--sh);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.face .ru{font-size:1.7rem;font-weight:600;line-height:1.3}
.face .ka{font-size:clamp(2rem,8vw,2.6rem)}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--mu);font-size:.85rem}
.score{font-size:4rem;font-weight:700;color:var(--ac);line-height:1;margin:40px 0 4px 4px;font-variant-numeric:tabular-nums}
.pct{color:var(--mu);margin:0 0 24px 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hd"><button id="back" hidden aria-label="Назад"></button><div><h1 id="h"></h1><p id="sub"></p></div></div></header>
<main id="m"></main>
<script src="lib.js"></script>
<script>
const FILES = ['data/part1.md', 'data/part2.md', 'data/part3.md'];
const $ = s => document.querySelector(s), m = $('#m'), h = $('#h'), backBtn = $('#back');
const esc = s => s.replace(/[&<>"]/g, c => '&#' + c.charCodeAt() + ';');
const ic = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  chev: ic('<path d="M9 6l6 6-6 6"/>'), back: ic('<path d="M15 6l-6 6 6 6"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  list: ic('<path d="M4 6h16M4 12h16M4 18h10"/>'),
  cards: ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/>'),
  choice: ic('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'),
  type: ic('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>')
};
const pl = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'выражение' : n % 10 > 1 && n % 10 < 5 && (n % 100 < 12 || n % 100 > 14) ? 'выражения' : 'выражений');
const row = q => `<div class="item"><b class="ka">${esc(q.ka)}</b><span>${esc(q.ru)}</span>${q.ctx ? `<small>${esc(q.ctx)}</small>` : ''}</div>`;
let chapters = [], onBack = null;
backBtn.innerHTML = I.back;
backBtn.onclick = () => onBack && onBack();

function view(title, html, up, sub = '') {
  h.textContent = title; h.lang = up ? 'ru' : 'ka'; $('#sub').textContent = sub;
  m.innerHTML = `<div class="scr">${html}</div>`; m.onclick = null;
  onBack = up; backBtn.hidden = !up; document.body.classList.toggle('home', !up); scrollTo(0, 0);
}

function home() {
  const all = chapters.flatMap(c => c.levels.flatMap(l => l.items));
  view('ქართული', `<div class="sb">${I.search}<input id="q" type="search" placeholder="Поиск по грузинскому и русскому" aria-label="Поиск"></div><div id="res"></div><div id="list">` +
    chapters.map((c, ci) => `<div class="ch"><small>Глава ${ci + 1}</small><h2>${esc(c.title)}</h2></div><div class="grid">` + c.levels.map((l, li) =>
      `<button class="row" data-c="${ci}" data-l="${li}"><span>${esc(l.name)}</span><span class="n">${l.items.length}</span>${I.chev}</button>`).join('') + '</div>').join('') + '</div>',
    null, 'Разговорный · ' + pl(all.length));
  $('#q').oninput = e => {
    const t = e.target.value.trim().toLowerCase(), r = t ? all.filter(q => (q.ka + ' ' + q.ru).toLowerCase().includes(t)) : [];
    $('#list').hidden = !!t;
    $('#res').innerHTML = !t ? '' : r.length ? `<div class="panel">${r.map(row).join('')}</div>` : '<p class="ctx">Ничего не найдено</p>';
  };
  m.onclick = e => { const b = e.target.closest('[data-c]'); if (b) level(+b.dataset.c, +b.dataset.l); };
}

function level(c, l) {
  const lv = chapters[c].levels[l], up = () => level(c, l);
  view(lv.name, '<div class="tiles">' + [['list', 'Список', 'Все выражения'], ['cards', 'Карточки', 'Листай и переворачивай'],
    ['choice', 'Выбор ответа', '4 варианта'], ['type', 'Ввод перевода', 'Печатай по-грузински']]
    .map(([k, t, d]) => `<button class="tile" data-k="${k}">${I[k]}<b>${t}</b><small>${d}</small></button>`).join('') + '</div>', home, pl(lv.items.length));
  m.onclick = e => {
    const k = e.target.closest('[data-k]')?.dataset.k;
    if (k === 'list') view(lv.name, `<div class="panel">${lv.items.map(row).join('')}</div>`, up, pl(lv.items.length));
    else if (k === 'cards') cards(c, l);
    else if (k) quiz(c, l, k);
  };
}

function cards(c, l) {
  const lv = chapters[c].levels[l], d = shuffle(lv.items); let i = 0;
  const draw = () => {
    const q = d[i];
    view(lv.name, `<div class="top"><span>${i + 1} из ${d.length}</span></div><div class="bar"><i style="width:${(i + 1) / d.length * 100}%"></i></div>` +
      `<div class="card" id="cd" role="button" tabindex="0" aria-label="Перевернуть"><div class="in"><div class="face"><span class="ru">${esc(q.ru)}</span><span class="hint">Нажми, чтобы перевернуть</span></div>` +
      `<div class="face b"><span class="ka">${esc(q.ka)}</span><span class="ctx">${esc(q.ctx)}</span></div></div></div><button class="btn" id="nx">Дальше</button>`, () => level(c, l));
    const cd = $('#cd'), flip = () => cd.classList.toggle('f');
    cd.onclick = flip; cd.onkeydown = e => (e.key === ' ' || e.key === 'Enter') && (e.preventDefault(), flip());
    $('#nx').onclick = () => { i = (i + 1) % d.length; draw(); };
  };
  draw();
}

function quiz(c, l, mode) {
  const lv = chapters[c].levels[l], pool = chapters[c].levels.flatMap(x => x.items);
  const qs = shuffle(mode === 'type' ? lv.items.filter(typable) : lv.items), up = () => level(c, l);
  let i = 0, score = 0;
  const end = () => {
    view(lv.name, `<p class="score">${score}/${qs.length}</p><p class="pct">${Math.round(score / qs.length * 100)}% верно</p>` +
      '<div class="btns"><button class="btn" id="again">Ещё раз</button><button class="btn sec" id="lvl">К уровню</button></div>', up);
    $('#again').onclick = () => quiz(c, l, mode); $('#lvl').onclick = up;
  };
  const ask = () => {
    const q = qs[i];
    view(lv.name, `<div class="top"><span>${i + 1} из ${qs.length}</span></div><div class="bar"><i style="width:${i / qs.length * 100}%"></i></div><p class="ask">${esc(q.ru)}</p>` +
      (mode === 'choice' ? options(q, pool).map(x => `<button class="opt">${esc(x.ka)}</button>`).join('')
        : '<input id="a" lang="ka" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="По-грузински"><button class="btn" id="ok">Проверить</button>') +
      '<div id="fb"></div>', up);
    const finish = good => {
      score += good;
      $('#fb').innerHTML = `<p class="msg ${good ? 'ok' : 'bad'}" id="msg">${good ? 'Верно' : 'Правильно: <span class="ka">' + esc(q.ka) + '</span>'}</p><div class="btns" style="margin-top:0">` +
        (good || mode !== 'type' ? '' : '<button class="btn sec" id="ov">Засчитать</button>') +
        `<button class="btn" id="nx">${i + 1 === qs.length ? 'Результат' : 'Дальше'}</button></div>`;
      $('#nx').onclick = () => (++i < qs.length ? ask() : end());
      const ov = $('#ov');
      if (ov) ov.onclick = () => { score++; $('#msg').className = 'msg ok'; $('#msg').textContent = 'Верно'; ov.remove(); };
    };
    if (mode === 'choice') m.onclick = e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      m.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.textContent === q.ka) o.classList.add('ok'); });
      if (b.textContent !== q.ka) b.classList.add('bad');
      finish(b.textContent === q.ka);
    };
    else {
      const a = $('#a'), go = () => { a.disabled = true; $('#ok').remove(); finish(check(q.ka, a.value)); };
      $('#ok').onclick = go; a.onkeydown = e => e.key === 'Enter' && go(); a.focus();
    }
  };
  qs.length ? ask() : end();
}

Promise.all(FILES.map(f => fetch(f).then(r => r.ok ? r.text() : Promise.reject(f)).then(parse)))
  .then(x => { chapters = x; home(); })
  .catch(f => view('Ошибка', `<p>Не удалось загрузить ${esc(String(f))}. Откройте приложение по адресу сайта, а не как файл с диска.</p>`));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
