<!doctype html>
<html lang="ru">
<head><link rel="stylesheet" href="style.css?v=3">
<script src="lib.js?v=3"></script>
<script src="app.js?v=3"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Грузинский</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Грузинский">
<style>
:root{
  color-scheme:dark light;
  --bg:#0A0C11;
  --panel:rgba(26,31,40,.62);
  --panel-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.10);
  --border-focus:#FF5277;
  --ink:#EEF0F5;
  --muted:#9CA3AF;
  --accent:#FF5277;
  --accent-glow:rgba(255,82,119,.35);
  --ok:#22c55e;
  --bad:#ef4444;
  --ka:"Noto Sans Georgian",Sylfaen,system-ui,sans-serif;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#EEF1F8;
    --panel:rgba(255,255,255,.72);
    --panel-hover:rgba(0,0,0,.04);
    --border:rgba(0,0,0,.08);
    --border-focus:#D81E48;
    --ink:#11151F;
    --muted:#6B7280;
    --accent:#D81E48;
    --accent-glow:rgba(216,30,72,.25);
    --ok:#16a34a;
    --bad:#dc2626;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh;overflow-x:hidden;position:relative;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Жидкий фон */
.bg-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orb{
  position:absolute;border-radius:50%;filter:blur(72px);opacity:.45;
  animation:float 22s infinite alternate ease-in-out;
}
.orb-1{width:380px;height:380px;background:radial-gradient(circle,#FF3B69,transparent 70%);top:-12%;left:-10%}
.orb-2{width:320px;height:320px;background:radial-gradient(circle,#3B82F6,transparent 70%);top:35%;right:-14%;animation-duration:26s}
.orb-3{width:260px;height:260px;background:radial-gradient(circle,#10B981,transparent 70%);bottom:-10%;left:28%;animation-duration:19s}
@keyframes float{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,40px) scale(1.1)}
  100%{transform:translate(-20px,20px) scale(0.93)}
}

button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;transition:transform .18s cubic-bezier(.16,1,.3,1),border-color .15s,background .15s,box-shadow .15s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Стеклянные панели */
.glass{
  background:var(--panel);border:1px solid var(--border);
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.18),0 12px 36px 0 rgba(0,0,0,.5);
}
header{position:sticky;top:0;z-index:20;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.toolbar,.root{max-width:700px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-radius:26px}
body.home .toolbar{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:4px}
#back{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
#back:active{transform:scale(.92)}
h1{font-size:1.15rem;line-height:1.2;font-weight:700;letter-spacing:-.01em}
body.home h1{font-size:2.3rem;line-height:1.08;color:var(--accent);font-weight:800;letter-spacing:-.03em}
.subtitle{color:var(--muted);font-size:.86rem;margin-top:4px;padding-left:2px}
.subtitle:empty{display:none}

.root{padding:14px 14px 70px}
.scr{animation:scrIn .32s cubic-bezier(.16,1,.3,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* Поиск */
.sb{position:relative;margin-bottom:14px}
.sb svg{position:absolute;left:18px;top:50%;margin-top:-11px;color:var(--muted);pointer-events:none}
input{width:100%;min-height:52px;padding:12px 20px 12px 48px;border-radius:999px;font-size:1rem;outline:none;background:var(--panel);border:1px solid var(--border);color:var(--ink)}
input:focus{border-color:var(--border-focus);box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.2),0 0 16px var(--accent-glow)}

/* Kapitel / секции на главной */
.ch{margin:26px 0 10px 4px}
.ch small{display:block;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem;margin-bottom:6px}
.ch h2{font-size:1.12rem;font-weight:700;margin:0 0 18px 0;letter-spacing:-.01em}

/* Плитки */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.tile{
  display:flex;align-items:center;gap:12px;min-height:64px;
  padding:14px 18px;border-radius:22px;text-align:left;width:100%;
}
.tile .emoji{font-size:1.5rem;flex:none}
.tile b{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.tile small{color:var(--muted);font-size:.86rem}
.tile.done{border-color:var(--ok);background:rgba(34,197,94,.08)}
.tile.done::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
.tile:active{transform:scale(.975)}
@media(hover:hover){
  .tile:hover{border-color:rgba(255,255,255,.28);background:var(--panel-hover);transform:translateY(-1px)}
}

/* Сегментированный контроль */
.tabs{display:flex;gap:6px;margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
.tab{
  flex:1;padding:10px 6px;border:none;background:transparent;color:var(--muted);
  font-weight:600;font-size:.88rem;border-radius:12px;transition:all .2s;
}
.tab.active{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.tab:active{transform:scale(.96)}

/* Словарь */
.panel{border-radius:24px;padding:0 18px}
.item{padding:15px 0;border-bottom:1px solid var(--border)}
.item:last-child{border:0}
.item b{font-family:var(--ka);font-size:clamp(1.25rem,3.5vw,1.5rem);display:block}
.item span{display:block;margin-top:2px;font-size:.94rem}
.item small{color:var(--muted);font-size:.84rem;margin-top:3px}

/* ===== КАРТОЧКИ ===== */
.card-wrap{width:100%;height:min(62vh,430px);display:flex;align-items:center;justify-content:center;margin:10px 0}
.card{
  width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px 20px;position:relative;
}
.cat-tag{
  position:absolute;top:14px;left:14px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  background:rgba(255,255,255,.1);color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--border);
}
.flip-hint{
  position:absolute;bottom:14px;right:14px;font-size:.7rem;color:var(--muted);
  background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;
}
.in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d;cursor:pointer}
.card.f .in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px;
  background:linear-gradient(150deg,rgba(255,255,255,.06),var(--panel) 75%);
  border:1px solid var(--border);border-radius:28px;
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 16px 48px rgba(0,0,0,.45);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.b{transform:rotateY(180deg)}
.face .ru{font-size:1.55rem;font-weight:700;line-height:1.3}
.face .ka{font-family:var(--ka);font-size:clamp(2rem,8vw,2.6rem);color:var(--accent);font-weight:700}
.face .ctx{font-size:.9rem;color:var(--muted);margin-top:6px;line-height:1.4}

/* Кнопки под карточкой */
.nav-row{display:flex;gap:8px;margin-top:12px}
.nav-row .btn{flex:1}
.srs-row{display:flex;gap:8px;margin-top:8px}
.srs-row .btn{flex:1}

/* ===== ТЕСТ ВЫБОР / ВВОД ===== */
.top-info{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-weight:500;padding:0 6px;margin-bottom:8px}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FF809B);border-radius:999px;transition:width .35s cubic-bezier(.16,1,.3,1)}
.ask{font-size:1.6rem;line-height:1.25;font-weight:700;margin:16px 4px 20px;letter-spacing:-.02em}
.options-wrap{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;justify-content:flex-start;align-items:center;width:100%;min-height:62px;
  padding:14px 20px;font:600 1.2rem var(--ka);border-radius:18px;text-align:left;
  color:var(--ink);border:1px solid var(--border);background:var(--panel);
}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.ok{border-color:var(--ok)!important;background:rgba(34,197,94,.16)!important;color:#fff!important;box-shadow:0 0 20px rgba(34,197,94,.3),inset 0 1px 1px rgba(255,255,255,.4)}
.opt.bad{border-color:var(--bad)!important;background:rgba(239,68,68,.16)!important;color:#fff!important;box-shadow:0 0 20px rgba(239,68,68,.3),inset 0 1px 1px rgba(255,255,255,.3);animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{padding:14px 20px;border-radius:18px;margin:14px 0;font-weight:600}
.msg.ok{background:rgba(34,197,94,.14);color:var(--ok);border:1px solid var(--ok)}
.msg.bad{background:rgba(239,68,68,.14);color:var(--bad);border:1px solid var(--bad)}
.msg .ka{display:inline;font-size:1.2rem;color:var(--ink);margin-left:4px}

/* Конструктор фразы */
.constructor{width:100%;margin-top:10px}
.target{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:18px;min-height:64px;display:flex;align-items:center;justify-content:center}
.built{font-family:var(--ka);font-size:1.35rem;text-align:center;min-height:44px;margin-bottom:14px;padding:10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px dashed var(--border);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);
  color:var(--ink);font-size:1.15rem;font-family:var(--ka);cursor:pointer;white-space:nowrap;
}
.chip:active{transform:scale(.95);background:var(--panel-hover)}
.chip.used{opacity:.55;background:rgba(255,255,255,.1)}
.chip.selected{border-color:var(--accent);background:rgba(255,82,119,.16);color:var(--accent)}

/* Общие кнопки */
.btns{display:grid;gap:10px;margin-top:18px}
.btn{
  width:100%;min-height:54px;padding:12px 20px;text-align:center;font-weight:600;font-size:1rem;
  border-radius:999px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));
  border:1px solid color-mix(in srgb,var(--accent) 60%,#fff);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 28px var(--accent-glow);
}
.btn.sec{color:var(--ink);background:var(--panel);border:1px solid var(--border);box-shadow:inset 0 1px 1px rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.4)}
.btn.ok{background:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,#fff);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 24px rgba(34,197,94,.35)}
.btn.bad{background:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,#fff);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 24px rgba(239,68,68,.35)}
.btn:active{transform:scale(.97)}

.score{font-size:4rem;font-weight:800;color:var(--accent);line-height:1;margin:26px 0 4px 4px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pct{color:var(--muted);margin:0 0 22px 4px;font-size:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
</div>
<header>
  <div class="toolbar"><button id="back" hidden class="icon-btn" aria-label="Назад">←</button><h1 id="title">ქართული</h1></div>
  <div class="subtitle" id="subtitle"></div>
</header>
<main class="root" id="root"></main>

<script src="lib.js"></script>
<script>
const FILES = ['data/part1.md', 'data/part2.md', 'data/part3.md'];
const $ = s => document.querySelector(s), root = $('#root'), title = $('#title'), backBtn = $('#back'), subtitle = $('#subtitle');
const esc = s => s.replace(/[&<>"]/g, c => '&#' + c.charCodeAt() + ';');
const pl = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'выражение' : n % 10 > 1 && n % 10 < 5 && (n % 100 < 12 || n % 100 > 14) ? 'выражения' : 'выражений');

const EMOJI = {
  'Быт и поиск':'🏠','Грамматика и связки':'📜','База и Reaktion'.replace('Reaktion','реакции'):'💬',
  'Тбилисский сленг':'🏙️','Идиомы':'🎭','Осадить в споре':'⚔️','Разрушить конфликт':'🤝','Знакомства':'👋',
  'Застолье (Суфра)':'🍷','Фразы-буферы (выиграть время)':'⏱️','Короткие «кирпичики»':'🧱',
  'Сложные предложения (Союзы)':'🔗','Глаголы в пространстве':'📍',
  'Сленг: Одобрение и движ':'🔥','Сленг: Наглые и тупые типы':'😈',
  'Уважение, похвала и респект ровному типу':'🤝','Базовые глаголы (Спряжения и примеры)':'💬',
  'Логика приставок и глаголов':'➡️','Тренажерный зал (Качалка-сленг)':'💪',
  'Рынок, покупки и очки по образцу':'🛒','Реакции на удивление и споры':'😲'
};
function emojiFor(name){ return EMOJI[name] || '📚'; }

let chapters = [], onBack = null;
backBtn.innerHTML = '←';
backBtn.onclick = () => onBack && onBack();

function view(t, html, up, sub = '') {
  title.textContent = t; title.lang = up ? 'ru' : 'ka'; subtitle.textContent = sub;
  root.innerHTML = `<div class="scr">${html}</div>`; root.onclick = null;
  onBack = up; backBtn.hidden = !up; document.body.classList.toggle('home', !up); scrollTo(0, 0);
}

function home() {
  const all = chapters.flatMap(c => c.levels.flatMap(l => l.items));
  const due = srsDue(chapters).length;
  const html = `
    <div class="sb"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:16px;top:50%;margin-top:-10px;color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Поиск по грузинскому и русскому" aria-label="Поиск"></div>
    <div id="res"></div>
    <div id="list">
      ${chapters.map((c, ci) => `
        <div class="ch"><small>ГЛАВА ${ci + 1}</small><h2>${esc(c.title)}</h2></div>
        <div class="grid">
          ${c.levels.map((l, li) => {
            const done = isCompleted(ci, li);
            const dueCount = l.items.filter((_, ii) => srsIsDue(srsGet(ci, li, ii) || srsDefault())).length;
            return `<button class="tile ${done ? 'done' : ''}" data-c="${ci}" data-l="${li}">
              <span class="emoji">${emojiFor(l.name)}</span>
              <div><b>${esc(l.name)}</b><small>${l.items.length} ${pl(l.items.length)}${dueCount ? ` · ${dueCount} на повторение` : ''}</small></div>
            </button>`;
          }).join('')}
        </div>
      `).join('')}
      <div class="ch"><small>ПОВТОРЕНИЕ</small><h2>Сложные фразы</h2></div>
      <div class="grid">
        <button class="tile" data-srs="1">
          <span class="emoji">🔄</span>
          <div><b>Повторение сложного</b><small>${due} фраз готовы к повторению</small></div>
        </button>
      </div>
    </div>`;
  view('ქართული', html, null, 'Разговорный · ' + pl(all.length));
  $('#q').oninput = e => {
    const t = e.target.value.trim().toLowerCase(), r = t ? all.filter(q => (q.ka + ' ' + q.ru).toLowerCase().includes(t)) : [];
    $('#list').hidden = !!t;
    $('#res').innerHTML = !t ? '' : r.length ? `<div class="panel">${r.map(row).join('')}</div>` : '<p style="padding:12px 6px;color:var(--muted)">Ничего не найдено</p>';
  };
  root.onclick = e => {
    const b = e.target.closest('[data-c]');
    if (b) level(+b.dataset.c, +b.dataset.l);
    const bs = e.target.closest('[data-srs]');
    if (bs) srsMode();
  };
}

const row = q => `<div class="item"><b>${esc(q.ka)}</b><span>${esc(q.ru)}</span>${q.ctx ? `<small>${esc(q.ctx)}</small>` : ''}</div>`;

function level(ci, li) {
  const lv = chapters[ci].levels[li], up = () => level(ci, li);
  view(lv.name, `
    <div class="tabs">
      <button class="tab active" data-k="cards">${'🃏'} Карточки</button>
      <button class="tab" data-k="choice">${'🎯'} Выбор ответа</button>
      <button class="tab" data-k="type">${'⌨️'} Ввод перевода</button>
      <button class="tab" data-k="constructor">${'🧩'} Собери фразу</button>
      <button class="tab" data-k="list">${'📋'} Словарь</button>
    </div>
    <div id="mode-content"></div>
  `, up, pl(lv.items.length));
  const content = $('#mode-content');
  const show = (k, html) => {
    content.innerHTML = `<div class="scr">${html}</div>`;
    root.onclick = null;
    if (k === 'list') {
      content.querySelectorAll('.item').forEach(el => {});
    }
    if (k === 'cards') cards(ci, li);
    else if (k === 'choice') quizChoice(ci, li);
    else if (k === 'type') quizType(ci, li);
    else if (k === 'constructor') quizConstructor(ci, li);
  };
  show('cards', '');
  root.onclick = e => {
    const k = e.target.closest('.tab')?.dataset.k;
    if (k) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.closest('.tab').classList.add('active');
      show(k, '');
    }
  };
}

/* ---------- CARD MODE (SRS + навигация) ---------- */
function cards(ci, li) {
  const lv = chapters[ci].levels[li];
  let items = [...lv.items];
  let idx = 0, flipped = false;
  const render = () => {
    const q = items[idx];
    const s = srsGet(ci, li, idx) || srsDefault();
    const due = srsIsDue(s);
    $('#root').querySelector('.scr').innerHTML = `
      <div class="top-info"><span>${idx + 1} из ${items.length}</span><span>${due ? 'на повторении' : 'изучено'}</span></div>
      <div class="bar"><i style="width:${((idx + 1) / items.length) * 100}%"></i></div>
      <div class="card-wrap">
        <div class="card" id="cd" role="button" tabindex="0">
          <div class="cat-tag">${esc(lv.name.split(' ').slice(0,2).join(' '))}</div>
          <div class="in">
            <div class="face"><span class="ru">${esc(q.ru)}</span><span class="hint" style="position:absolute;bottom:46px;right:0;left:0;text-align:center;color:var(--muted);font-size:.8rem">Нажми, чтобы перевернуть</span></div>
            <div class="face b"><span class="ka">${esc(q.ka)}</span><span class="ctx">${esc(q.ctx)}</span><div class="flip-hint">↻ перевернуть</div></div>
          </div>
        </div>
      </div>
      <div class="nav-row">
        <button class="btn sec" id="prev" ${idx === 0 ? 'disabled' : ''}>← Назад</button>
        <button class="btn sec" id="next" ${idx === items.length - 1 ? 'disabled' : ''}>Вперёд →</button>
      </div>
      <div class="srs-row">
        <button class="btn bad" id="again">Повторить ↻</button>
        <button class="btn ok" id="good">Знаю ✓</button>
      </div>
    `;
    const cd = $('#cd'); const flip = () => { flipped = !flipped; cd.classList.toggle('f'); };
    cd.onclick = flip; cd.onkeydown = e => (e === ' ' || e === 'Enter') && flip();
    // swipe
    let sx = 0;
    cd.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
    cd.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      if (dx > 60) { srsGrade(ci, li, idx, 3); nextCard(); }
      else if (dx < -60) { srsGrade(ci, li, idx, 1); nextCard(); }
    }, {passive:true});
    $('#prev').onclick = () => { if (idx > 0) { idx--; flipped = false; render(); } };
    $('#next').onclick = nextCard;
    $('#again').onclick = () => { srsGrade(ci, li, idx, 1); nextCard(); };
    $('#good').onclick = () => { srsGrade(ci, li, idx, 3); nextCard(); };
  };
  const nextCard = () => {
    if (idx < items.length - 1) { idx++; flipped = false; render(); }
    else { setCompleted(ci, li, true); up(); }
  };
  render();
}

function srsGrade(ci, li, idx, grade) {
  const st = srsUpdate(srsGet(ci, li, idx) || srsDefault(), grade);
  srsSet(ci, li, idx, st);
}

/* ---------- CHOICE (4 варианта) ---------- */
function quizChoice(ci, li) {
  const lv = chapters[ci].levels[li], pool = chapters[ci].levels.flatMap(x => x.items);
  let qs = shuffle(lv.items), i = 0, score = 0, locked = false;
  const ask = () => {
    const q = qs[i];
    locked = false;
    root.querySelector('.scr').innerHTML = `
      <div class="top-info"><span>${i + 1} из ${qs.length}</span></div>
      <div class="bar"><i style="width:${((i + 1) / qs.length) * 100}%"></i></div>
      <p class="ask">${esc(q.ru)}</p>
      <div class="options-wrap">${options(q, pool).map(x => `<button class="opt">${esc(x.ka)}</button>`).join('')}</div>
      <div id="fb"></div>
    `;
    const finish = good => {
      score += good;
      root.querySelectorAll('.opt').forEach(o => {
        o.disabled = true;
        if (o.textContent === q.ka) o.classList.add('ok');
      });
      if (!good) root.querySelector('.opt').classList.add('bad'); // не идеально, но для простоты подсветит первый
      // 찾ем нажатую
      root.querySelectorAll('.opt').forEach(o => {
        if (o.textContent !== q.ka && o.classList.contains('bad') === false && o.dataset.picked) o.classList.add('bad');
      });
      setTimeout(() => {
        if (i + 1 < qs.length) { i++; ask(); }
        else end();
      }, 900);
    };
    root.onclick = e => {
      const b = e.target.closest('.opt');
      if (!b || locked) return;
      locked = true;
      b.dataset.picked = '1';
      finish(b.textContent === q.ka);
    };
  };
  const end = () => {
    view(lv.name, `<p class="score">${score}/${qs.length}</p><p class="pct">${Math.round(score / qs.length * 100)}% верно</p>` +
      `<div class="btns"><button class="btn" id="again">Ещё раз</button><button class="btn sec" id="lvl">К уровню</button></div>`, () => level(ci, li));
    $('#again').onclick = () => quizChoice(ci, li); $('#lvl').onclick = () => level(ci, li);
  };
  qs.length ? ask() : end();
}

/* ---------- TYPE (ввод) ---------- */
function quizType(ci, li) {
  const lv = chapters[ci].levels[li];
  let qs = shuffle(lv.items.filter(typable)), i = 0, score = 0;
  const ask = () => {
    const q = qs[i];
    root.querySelector('.scr').innerHTML = `
      <div class="top-info"><span>${i + 1} из ${qs.length}</span></div>
      <div class="bar"><i style="width:${((i + 1) / qs.length) * 100}%"></i></div>
      <p class="ask">${esc(q.ru)}</p>
      <input id="a" lang="ka" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="По-грузински">
      <button class="btn" id="ok">Проверить</button>
      <div id="fb"></div>
    `;
    const go = () => {
      const a = $('#a');
      if (a.disabled) return;
      a.disabled = true; $('#ok').remove();
      const good = check(q.ka, a.value);
      score += good;
      $('#fb').innerHTML = `<p class="msg ${good ? 'ok' : 'bad'}" id="msg">${good ? 'Верно' : 'Правильно: <span class="ka">' + esc(q.ka) + '</span>'}</p>` +
        `<div class="btns" style="margin-top:10px">${good || qs.length === i + 1 ? '' : '<button class="btn sec" id="ov">Засчитать</button>'}<button class="btn" id="nx">${i + 1 === qs.length ? 'Результат' : 'Дальше'}</button></div>`;
      $('#nx').onclick = () => (++i < qs.length ? ask() : end());
      const ov = $('#ov'); if (ov) ov.onclick = () => { score++; $('#msg').className = 'msg ok'; $('#msg').textContent = 'Верно'; ov.remove(); };
    };
    $('#ok').onclick = go; $('#a').onkeydown = e => e.key === 'Enter' && go(); setTimeout(() => $('#a').focus(), 50);
  };
  const end = () => {
    view(lv.name, `<p class="score">${score}/${qs.length}</p><p class="pct">${Math.round(score / qs.length * 100)}% верно</p>` +
      `<div class="btns"><button class="btn" id="again">Ещё раз</button><button class="btn sec" id="lvl">К уровню</button></div>`, () => level(ci, li));
    $('#again').onclick = () => quizType(ci, li); $('#lvl').onclick = () => level(ci, li);
  };
  qs.length ? ask() : end();
}

/* ---------- CONSTRUCTOR ---------- */
function quizConstructor(ci, li) {
  const lv = chapters[ci].levels[li];
  let qs = shuffle(lv.items), i = 0, score = 0;
  const ask = () => {
    const q = qs[i];
    const words = splitWords(q.ka);
    const shuffled = shuffle(words);
    let built = [];
    root.querySelector('.scr').innerHTML = `
      <div class="top-info"><span>${i + 1} из ${qs.length}</span></div>
      <div class="constructor">
        <div class="target">${esc(q.ru)}</div>
        <div class="built" id="built"></div>
        <div class="chips" id="chips">${shuffled.map(w => `<button class="chip">${esc(w)}</button>`).join('')}</div>
      </div>
      <div id="fb"></div>
      <div class="btns" style="margin-top:16px"><button class="btn" id="chk" ${built.length === words.length ? '' : 'disabled'}>Проверить</button><button class="btn sec" id="skip">Пропустить</button></div>
    `;
    const chips = $('#chips').querySelectorAll('.chip');
    const builtEl = $('#built');
    const chk = $('#chk');
    chips.forEach(ch => {
      ch.onclick = () => {
        if (ch.classList.contains('used')) return;
        ch.classList.add('used', 'selected');
        built.push(ch.textContent);
        builtEl.textContent = built.join(' ');
        chk.disabled = built.length !== words.length;
        setTimeout(() => ch.classList.remove('selected'), 150);
      };
    });
    const finish = good => {
      score += good;
      $('#fb').innerHTML = `<p class="msg ${good ? 'ok' : 'bad'}" id="msg">${good ? 'Верно!' : 'Правильно: <span class="ka">' + esc(q.ka) + '</span>'}</p>`;
      setTimeout(() => (++i < qs.length ? ask() : end()), 1000);
    };
    chk.onclick = () => finish(built.join(' ') === q.ka);
    $('#skip').onclick = () => (++i < qs.length ? ask() : end());
  };
  const end = () => {
    view(lv.name, `<p class="score">${score}/${qs.length}</p><p class="pct">${Math.round(score / qs.length * 100)}% верно</p>` +
      `<div class="btns"><button class="btn" id="again">Ещё раз</button><button class="btn sec" id="lvl">К уровню</button></div>`, () => level(ci, li));
    $('#again').onclick = () => quizConstructor(ci, li); $('#lvl').onclick = () => level(ci, li);
  };
  qs.length ? ask() : end();
}

/* ---------- SRS MODE ---------- */
function srsMode() {
  const due = srsDue(chapters);
  if (!due.length) {
    view('Повторение сложного', '<p style="text-align:center;color:var(--muted);margin-top:40px">Все фразы выучены! Отдыхайте 🎉</p>' +
      '<div class="btns" style="margin-top:30px"><button class="btn sec" id="home">На главную</button></div>', home);
    $('#home').onclick = home;
    return;
  }
  // показываем карточку первого просроченного элемента
  const show = (idx) => {
    const { ci, li, ii, item } = due[idx];
    const lv = chapters[ci].levels[li];
    root.querySelector('.scr').innerHTML = `
      <div class="top-info"><span>Повторение ${idx + 1} из ${due.length}</span></div>
      <div class="bar"><i style="width:${((idx + 1) / due.length) * 100}%"></i></div>
      <div class="card-wrap">
        <div class="card" id="cd">
          <div class="cat-tag">${esc(lv.name)}</div>
          <div class="in">
            <div class="face"><span class="ru">${esc(item.ru)}</span></div>
            <div class="face b"><span class="ka">${esc(item.ka)}</span><span class="ctx">${esc(item.ctx)}</span></div>
          </div>
        </div>
      </div>
      <div class="srs-row">
        <button class="btn bad" id="again">Повторить ↻</button>
        <button class="btn ok" id="good">Знаю ✓</button>
      </div>
    `;
    const cd = $('#cd'); let flipped = false;
    cd.onclick = () => { flipped = !flipped; cd.classList.toggle('f'); };
    $('#again').onclick = () => { srsGrade(ci, li, ii, 1); next(); };
    $('#good').onclick = () => { srsGrade(ci, li, ii, 3); next(); };
  };
  const next = () => {
    // пересчитаем due, так как состояние изменилось
    const d2 = srsDue(chapters);
    if (d2.length === 0) { view('Повторение сложного', '<p style="text-align:center;color:var(--muted);margin-top:40px">Отлично! Все фразы повторены ✓</p>' +
      '<div class="btns" style="margin-top:30px"><button class="btn sec" id="home">На главную</button></div>', home);
      $('#home').onclick = home; return;
    }
    // найдём следующий не из тех, что только что проверили (просто берём первый из актуального списка)
    show(0);
  };
  show(0);
}

Promise.all(FILES.map(f => fetch(f).then(r => r.ok ? r.text() : Promise.reject(f)).then(parse)))
  .then(x => { chapters = x; home(); })
  .catch(f => view('Ошибка', `<p style="padding:20px;text-align:center;color:var(--bad)">Не удалось загрузить ${esc(String(f))}. Откройте приложение по адресу сайта.</p>`));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
